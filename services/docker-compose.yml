services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"   # cloudflared → localhost; tailnet-доступ через `tailscale serve`
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment: [PUID=1000, PGID=1000, WEBUI_PORT=8080]
    volumes:
      - qbt_config:/config
      - /srv/data/downloads:/downloads
  filebrowser:
    image: filebrowser/filebrowser:latest
    restart: unless-stopped
    volumes:
      - /srv/data:/srv
      - fb_db:/database
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/data:/data:ro
  sms-bridge:
    build: ../sms-bridge
    restart: unless-stopped
    env_file: /srv/persist/services.env
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
    privileged: true   # доступ к модему; сузить до нужных cap при обкатке
volumes: { caddy_data: {}, qbt_config: {}, fb_db: {} }

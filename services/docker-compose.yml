services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"   # cloudflared → localhost; tailnet-доступ через `tailscale serve`
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment: [PUID=1000, PGID=1000, WEBUI_PORT=8080]
    volumes:
      - qbt_config:/config
      - /srv/data/downloads:/downloads
  filebrowser:
    image: filebrowser/filebrowser:latest
    restart: unless-stopped
    environment:
      FB_BASEURL: /files
    volumes:
      - /srv/data:/srv
      - fb_db:/database
      - ./filebrowser/settings.json:/config/settings.json:ro
  portainer:
    image: portainer/portainer-ce:latest
    command: --base-url /portainer
    restart: unless-stopped
    environment:
      # Portainer CSRF-защита сверяет заголовок Origin с этим списком;
      # без него запросы через прокси NAS (Origin с портом 8095) получают 403.
      - TRUSTED_ORIGINS=http://192.168.68.59:8095
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
  sms-bridge:
    profiles: ["sms"]
    build: ../sms-bridge
    restart: unless-stopped
    env_file: /srv/persist/services.env
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
    privileged: true   # доступ к модему; сузить до нужных cap при обкатке
volumes: { caddy_data: {}, qbt_config: {}, fb_db: {}, portainer_data: {} }

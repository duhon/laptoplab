# TLP disk power management for konotop (ThinkPad T420)
# sda = Kingston SSD (system/recovery/persist)
# sdb = Western Digital HDD (data /srv/data)

DISK_DEVICES="sda sdb"

# APM: 254 (no spin down / max performance for SSD), 127 (enable spin down for HDD)
DISK_APM_LEVEL_ON_AC="254 127"
DISK_APM_LEVEL_ON_BAT="254 127"

# Spindown timeout: 0 = disabled (SSD), 60 = 5 minutes (HDD, 60 * 5s = 300s)
DISK_SPINDOWN_TIMEOUT_ON_AC="0 60"
DISK_SPINDOWN_TIMEOUT_ON_BAT="0 60"

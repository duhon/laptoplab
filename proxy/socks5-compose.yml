# proxy/socks5-compose.yml — bind только на tailnet-IP (не 0.0.0.0).
# Запускать с --env-file /srv/persist/services.env.
services:
  socks5:
    image: serjs/go-socks5-proxy:latest
    restart: unless-stopped
    ports:
      - "${KONOTOP_TS_IP:-100.65.92.104}:1080:1080"
    environment:
      REQUIRE_AUTH: "false"
